    <!-- drag va swipe js-->
    <script>
        const sheet = document.querySelector('.bottom-sheet');
        const handle = document.querySelector('.sheet-handle');
        const title = document.querySelector('.sheet-title');
        const minHeight = 480;
        const maxHeight = 680;
        let isDragging = false;
        let startY = 0;
        let startHeight = minHeight;
        function startDrag(e) {
            isDragging = true;
            startY = e.clientY || (e.touches && e.touches[0].clientY);
            startHeight = sheet.offsetHeight;
            sheet.style.transition = 'none';
            document.body.style.userSelect = 'none';
        }

        function onDrag(e) {
            if (!isDragging) return;
            const currentY = e.clientY || (e.touches && e.touches[0].clientY);
            if (!currentY) return;
            const deltaY = startY - currentY;
            let newHeight = startHeight + deltaY;
            if (newHeight < minHeight) {
                newHeight = minHeight - (minHeight - newHeight) * 0.2;
            } else if (newHeight > maxHeight) {
                newHeight = maxHeight + (newHeight - maxHeight) * 0.2;
            }
            sheet.style.height = `${newHeight}px`;
        }
        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            document.body.style.userSelect = '';

            sheet.style.transition = 'height 0.35s cubic-bezier(0.25, 1, 0.5, 1)';
            const currentHeight = sheet.offsetHeight;
            const isExpanded = sheet.classList.contains('expanded');
            if (!isExpanded) {
                if (currentHeight > minHeight + 50) {
                    sheet.classList.add('expanded');
                    sheet.style.height = `${maxHeight}px`;
                } else {
                    sheet.style.height = `${minHeight}px`;
                }
            } else {
                if (currentHeight < maxHeight - 50) {
                    sheet.classList.remove('expanded');
                    sheet.style.height = `${minHeight}px`;
                } else {
                    sheet.style.height = `${maxHeight}px`;
                }
            }
        }
        [handle, title].forEach(el => {
            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDrag, { passive: true });
        });
        window.addEventListener('mousemove', onDrag);
        window.addEventListener('touchmove', onDrag, { passive: true });
        window.addEventListener('mouseup', endDrag);
        window.addEventListener('touchend', endDrag);
    </script>

</body>

</html>
