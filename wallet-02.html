<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exchange</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="w-02.css" />
</head>

<body>
    <div class="mobile-frame">
        <header class="header">
            <button class="btn-icon" aria-label="Back">
                <img src="assets/wallet-ha/arrow-Left.svg" alt="Back" width="20" height="20" />
            </button>
            <h1 class="header-title">Exchange</h1>
            <div class="header-placeholder"></div>
        </header>

        <main class="content">
            <section class="swap-section">
                <div class="section-label">
                    <span>You pay</span>
                    <span class="balance">Balance: 0</span>
                </div>

                <div class="token-input-card">
                    <div class="token-selector" id="paySelector">
                        <img src="assets/wallet-ha/matic-token-icon 2.svg" alt="ETH" class="token-icon-img" width="30"
                            height="30" />
                        <span class="token-name">ETH</span>
                        <img src="assets/wallet-ha/arrow-down.svg" alt="down" class="chevron-icon" width="20"
                            height="20" />

                        <div class="token-dropdown-menu">
                            <div class="dropdown-item selected" data-name="ETH">
                                <img src="assets/wallet-ha/matic-token-icon 2.svg" alt="ETH" />
                                <span>ETH</span>
                            </div>
                            <div class="dropdown-item" data-name="SOL">
                                <img src="assets/bottom-sheet/image 441.svg" alt="SOL" />
                                <span>SOL</span>
                            </div>
                            <div class="dropdown-item" data-name="DAI">
                                <img src="assets/wallet-ha/matic-token-icon 3.svg" alt="DAI" />
                                <span>DAI</span>
                            </div>
                            <div class="dropdown-item" data-name="DASH">
                                <img src="assets/bottom-sheet/image 443.svg" alt="DASH" />
                                <span>DASH</span>
                            </div>
                            <div class="dropdown-item" data-name="BTC">
                                <img src="assets/bottom-sheet/image 439.svg" alt="BTC" />
                                <span>BTC</span>
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>
                    <div class="token-amount">
                        <input type="text" inputmode="decimal" class="amount-input" id="payAmountInput"
                            placeholder="0.000" value="" />
                        <span class="fiat-value" id="payFiatValue">$ 0</span>
                    </div>
                </div>
            </section>

            <!-- swapper button-->
            <div class="swap-action-wrapper">
                <button class="btn-swap" aria-label="Swap">
                    <img src="assets/wallet-ha/Vertical_switch_alt.svg" alt="Swap" width="24" height="24" />
                </button>
            </div>

            <!-- receive -->
            <section class="swap-section">
                <div class="section-label">
                    <span>You Receive</span>
                </div>

                <div class="token-input-card">
                    <div class="token-selector" id="receiveSelector">
                        <img src="assets/wallet-ha/matic-token-icon 3.svg" alt="DAI" class="token-icon-img" width="30"
                            height="30" />
                        <span class="token-name">DAI</span>
                        <img src="assets/wallet-ha/arrow-down.svg" alt="down" class="chevron-icon" width="20"
                            height="20" />

                        <div class="token-dropdown-menu">
                            <div class="dropdown-item selected" data-name="DAI">
                                <img src="assets/wallet-ha/matic-token-icon 3.svg" alt="DAI" />
                                <span>DAI</span>
                            </div>
                            <div class="dropdown-item" data-name="ETH">
                                <img src="assets/wallet-ha/matic-token-icon 2.svg" alt="ETH" />
                                <span>ETH</span>
                            </div>
                            <div class="dropdown-item" data-name="SOL">
                                <img src="assets/bottom-sheet/image 441.svg" alt="SOL" />
                                <span>SOL</span>
                            </div>
                            <div class="dropdown-item" data-name="DASH">
                                <img src="assets/bottom-sheet/image 443.svg" alt="DASH" />
                                <span>DASH</span>
                            </div>
                        </div>
                    </div>

                    <div class="divider"></div>
                    <div class="token-amount">
                        <input type="text" inputmode="decimal" class="amount-input" id="receiveAmountInput"
                            placeholder="0.000" value="1320.64" />
                        <div class="amount-sub">
                            <span class="fiat-value" id="receiveFiatValue">1 320.6</span>
                            <span class="badge-success">+0%</span>
                        </div>
                    </div>
                </div>

                <div class="percent-chips">
                    <button class="chip chip-25">25%</button>
                    <button class="chip chip-50">50%</button>
                    <button class="chip chip-75">75%</button>
                    <button class="chip chip-100">100%</button>
                </div>
            </section>

            <!-- connect wallet button -->
            <button class="btn-connect">Swap</button>

            <!-- detail swap-->
            <section class="details-section">
                <div class="details-header">
                    <span>Swap Details</span>
                    <span class="pair-tag" id="detailPairTag">ETH \ <strong class="highlight">DAI</strong></span>
                </div>
                <div class="details-card">
                    <div class="detail-row">
                        <span class="label">Rate</span>
                        <span class="val" id="detailRate">1 ETH ~ 2443 DAI</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Fee</span>
                        <span class="val" id="detailFee">0.0031 ETH</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Price impact</span>
                        <span class="val" id="detailImpact">&lt; 0.ha%</span>
                    </div>
                    <div class="detail-row">
                        <span class="label">Minimum received</span>
                        <span class="val" id="detailMinReceived">0.0000 DAI</span>
                    </div>
                </div>
            </section>
        </main>

        <!-- bottom nav-->
        <nav class="bottom-nav">
            <button class="nav-item">
                <img src="assets/wallet-ha/Wallet.svg" alt="Wallet" width="22" height="22" />
            </button>
            <button class="nav-item active">
                <img src="assets/wallet-ha/Regroup.svg" alt="Exchange" width="22" height="22" />
            </button>
            <button class="nav-item">
                <img src="assets/wallet-ha/Carbs.svg" alt="Earn" width="22" height="22" />
            </button>
            <button class="nav-item">
                <img src="assets/wallet-ha/world_2_light.svg" alt="Browser" width="22" height="22" />
            </button>
            <button class="nav-item">
                <img src="assets/wallet-ha/Setting_alt_line_duotone_line.svg" alt="Settings" width="22" height="22" />
            </button>
        </nav>
    </div>

    <script>
        let tokenPrices = {
            ETH: 2640,
            BTC: 63500,
            SOL: 152,
            DAI: 1.0,
            DASH: 24.5,
            USDT: 1.0,
        };

        // api
        async function fetchCryptoPrices() {
            const url =
                "https://api.coingecko.com/api/v3/simple/price?ids=ethereum,bitcoin,solana,dai,dash,tether&vs_currencies=usd";
            try {
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data.ethereum) tokenPrices["ETH"] = data.ethereum.usd;
                    if (data.bitcoin) tokenPrices["BTC"] = data.bitcoin.usd;
                    if (data.solana) tokenPrices["SOL"] = data.solana.usd;
                    if (data.dai) tokenPrices["DAI"] = data.dai.usd;
                    if (data.dash) tokenPrices["DASH"] = data.dash.usd;
                    if (data.tether) tokenPrices["USDT"] = data.tether.usd;
                    console.log(
                        "✅ قیمت‌های آنلاین CoinGecko دریافت شدند:",
                        tokenPrices,
                    );
                    recalculateSwap();
                }
            } catch (e) {
                console.log("استفاده از قیمت‌های پیش‌فرض");
                recalculateSwap();
            }
        }

        function recalculateSwap() {
            const paySelector = document.getElementById("paySelector");
            const receiveSelector = document.getElementById("receiveSelector");
            if (!paySelector || !receiveSelector) return;

            // token select shode
            const payToken = paySelector
                .querySelector(".token-name")
                .textContent.trim();
            const receiveToken = receiveSelector
                .querySelector(".token-name")
                .textContent.trim();

            const payInput = document.getElementById("payAmountInput");
            const receiveInput = document.getElementById("receiveAmountInput");
            const payFiat = document.getElementById("payFiatValue");
            const receiveFiat = document.getElementById("receiveFiatValue");

            const detailPairTag = document.getElementById("detailPairTag");
            const detailRate = document.getElementById("detailRate");
            const detailFee = document.getElementById("detailFee");
            const detailImpact = document.getElementById("detailImpact");
            const detailMinReceived = document.getElementById("detailMinReceived");

            // api
            const pricePay = tokenPrices[payToken] || 1;
            const priceReceive = tokenPrices[receiveToken] || 1;

            const rate = pricePay / priceReceive;

            if (detailPairTag) {
                detailPairTag.innerHTML = `${payToken} \\ <strong class="highlight">${receiveToken}</strong>`;
            }

            if (detailRate) {
                const formattedRate = rate >= 1 ? rate.toFixed(2) : rate.toFixed(6);
                detailRate.textContent = `1 ${payToken} ~ ${formattedRate} ${receiveToken}`;
            }

            const payVal = parseFloat(payInput.value);

            if (!isNaN(payVal) && payVal > 0) {
                const totalUsd = payVal * pricePay;
                payFiat.textContent = `$ ${totalUsd.toLocaleString(undefined, { maximumFractionDigits: 2 })}`;

                const receiveTotal = payVal * rate;
                receiveInput.value = receiveTotal.toFixed(4);
                if (receiveFiat) {
                    receiveFiat.textContent = totalUsd.toLocaleString(undefined, {
                        maximumFractionDigits: 1,
                    });
                }

                // free js
                if (detailFee) {
                    const feeAmount = (payVal * 0.0025).toFixed(4);
                    detailFee.textContent = `${feeAmount} ${payToken}`;
                }

                if (detailImpact) {
                    if (totalUsd > 50000) {
                        detailImpact.textContent = "~ 0.15%";
                    } else if (totalUsd > 10000) {
                        detailImpact.textContent = "~ 0.05%";
                    } else {
                        detailImpact.textContent = "< 0.ha%";
                    }
                }

                if (detailMinReceived) {
                    const minReceiveVal = (receiveTotal * 0.995).toFixed(4);
                    detailMinReceived.textContent = `${minReceiveVal} ${receiveToken}`;
                }
            } else {
                payFiat.textContent = "$ 0";
                receiveInput.value = "";
                if (receiveFiat) receiveFiat.textContent = "0";
                if (detailFee) detailFee.textContent = `0.0000 ${payToken}`;
                if (detailImpact) detailImpact.textContent = "< 0.ha%";
                if (detailMinReceived)
                    detailMinReceived.textContent = `0.0000 ${receiveToken}`;
            }
        }

        const payInputEl = document.getElementById("payAmountInput");
        if (payInputEl) {
            payInputEl.addEventListener("input", (e) => {
                e.target.value = e.target.value.replace(/[^0-9.]/g, "");
                recalculateSwap();
            });
        }

        // ۵. drop down js
        document.querySelectorAll(".token-selector").forEach((selector) => {
            const menu = selector.querySelector(".token-dropdown-menu");
            const tokenName = selector.querySelector(".token-name");
            const tokenImg = selector.querySelector(".token-icon-img");

            selector.addEventListener("click", (e) => {
                e.stopPropagation();
                document.querySelectorAll(".token-dropdown-menu").forEach((m) => {
                    if (m !== menu) m.classList.remove("active");
                });
                document.querySelectorAll(".token-selector").forEach((s) => {
                    if (s !== selector) s.classList.remove("open");
                });

                menu.classList.toggle("active");
                selector.classList.toggle("open");
            });

            menu.querySelectorAll(".dropdown-item").forEach((item) => {
                item.addEventListener("click", (e) => {
                    e.stopPropagation();
                    const nameSpan = item.querySelector("span");
                    const itemImg = item.querySelector("img");

                    if (nameSpan) tokenName.textContent = nameSpan.textContent.trim();
                    if (itemImg) tokenImg.src = itemImg.getAttribute("src");

                    menu
                        .querySelectorAll(".dropdown-item")
                        .forEach((i) => i.classList.remove("selected"));
                    item.classList.add("selected");

                    menu.classList.remove("active");
                    selector.classList.remove("open");

                    recalculateSwap();
                });
            });
        });

        document.addEventListener("click", () => {
            document
                .querySelectorAll(".token-dropdown-menu")
                .forEach((m) => m.classList.remove("active"));
            document
                .querySelectorAll(".token-selector")
                .forEach((s) => s.classList.remove("open"));
        });

        // swipe button va animation js
        const swapBtn = document.querySelector(".btn-swap");
        const connectBtn = document.querySelector(".btn-connect");
        const cards = document.querySelectorAll(".token-input-card");
        let swapAngle = 0;
        function executeSwap() {
            if (cards.length < 2) return;
            const cardPay = cards[0];
            const cardReceive = cards[1];
            if (connectBtn) {
                connectBtn.animate(
                    [
                        { transform: "scale(1)", backgroundColor: "#EAECEF" },
                        { transform: "scale(0.982)", backgroundColor: "#DCE0E6" },
                        { transform: "scale(1)", backgroundColor: "#EAECEF" },
                    ],
                    {
                        duration: 380,
                        easing: "cubic-bezier(0.25, 1, 0.5, 1)",
                    },
                );
            }

            swapAngle += 180;
            if (swapBtn) {
                swapBtn.style.transform = `rotate(${swapAngle}deg)`;
            }

            cardPay.classList.add("swap-anim-down");
            cardReceive.classList.add("swap-anim-up");
            setTimeout(() => {
                const payName = cardPay.querySelector(".token-name");
                const payImg = cardPay.querySelector(".token-icon-img");
                const receiveName = cardReceive.querySelector(".token-name");
                const receiveImg = cardReceive.querySelector(".token-icon-img");
                const tempName = payName.textContent;
                const tempSrc = payImg.getAttribute("src");
                payName.textContent = receiveName.textContent;
                payImg.src = receiveImg.getAttribute("src");
                receiveName.textContent = tempName;
                receiveImg.src = tempSrc;
                const payInput = cardPay.querySelector(".amount-input");
                const receiveInput = cardReceive.querySelector(".amount-input");
                if (payInput && receiveInput) {
                    const tempVal = payInput.value;
                    payInput.value = receiveInput.value;
                    receiveInput.value = tempVal;
                }
                cardPay.classList.remove("swap-anim-down");
                cardReceive.classList.remove("swap-anim-up");
                recalculateSwap();
            }, 160);
        }
        if (swapBtn) swapBtn.addEventListener("click", executeSwap);
        if (connectBtn) connectBtn.addEventListener("click", executeSwap);

        fetchCryptoPrices();
        setInterval(fetchCryptoPrices, 60000);

        document.querySelectorAll(".chip").forEach((chip) => {
            chip.addEventListener("click", () => {
                const currentVal = parseFloat(payInputEl.value);
                if (isNaN(currentVal) || currentVal <= 0) return;
                const percent = parseFloat(chip.textContent) / 100;
                payInputEl.value = parseFloat((currentVal * percent).toFixed(4));
                recalculateSwap();
            });
        });
    </script>
</body>

</html>
